name: openwar

# Environment shared by every app binary (service names resolve via the
# same user-defined network; per-service overrides add their own keys).
x-app-env: &app-env
  APP_ENV: "production"
  REDIS_ADDR: "redis:6379"
  REDIS_PASS: "openwar-redis-pass"
  NATS_URL: "nats://nats:4222"
  DATABASE_URL: "postgres://openwar:openwar@postgres:5432/openwar"
  JWT_SECRET: "openwar-super-secret-key-32-bytes-long"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openwar
      POSTGRES_PASSWORD: openwar
      POSTGRES_DB: openwar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwar -d openwar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "openwar-redis-pass"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Application ─────────────────────────────────────────────────────────
  backend-demo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/backend-demo"]
    environment:
      <<: *app-env
      BACKEND_ADDR: ":9001"
      INVENTORY_SHARDS: "32"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve"]
    environment:
      <<: *app-env
      LISTEN_ADDR: ":8080"
      BACKEND_URL: "http://backend-demo:9001"
      ALLOWED_ORIGINS: "http://localhost"
      ADMISSION_RATE: "100"
      INVENTORY_SHARDS: "32"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/worker"]
    environment:
      <<: *app-env
      PAYMENT_WINDOW: "15m"
      ADMISSION_RATE: "100"
      ADMISSION_EVENT: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ── Tools (run explicitly via: docker compose --profile tools run --rm k6) ──
  k6:
    image: grafana/k6:latest
    command: ["run", "/scripts/flashsale.js"]
    profiles: ["tools"]
    volumes:
      - ../test:/scripts
    environment:
      JWT_SECRET: "openwar-super-secret-key-32-bytes-long"
    depends_on:
      gateway:
        condition: service_started

volumes:
  nats-data:
  postgres-data:
  redis-data: